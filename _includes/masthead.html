{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">

        <button>
          <div class="navicon"></div>
        </button>

        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ base_path }}/">{{ site.title }}</a>
          </li>

          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}

            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}">
                {{ link.title }}
              </a>
            </li>
          {% endfor %}

          <!-- Theme toggle button -->
          <li class="masthead__menu-item persist" style="margin-left:auto;">
            <button
              id="theme-toggle"
              type="button"
              aria-label="Toggle light/dark mode"
              title="Toggle light/dark mode"
              style="background:none;border:none;cursor:pointer;font-size:1.2rem;padding:0;"
            >
              🌙
            </button>
          </li>

        </ul>

        <ul class="hidden-links hidden"></ul>

      </nav>
    </div>
  </div>
</div>
